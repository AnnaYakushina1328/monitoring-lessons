<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Новое посещение</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fa;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 850px;
            margin: 0 auto;
            padding: 45px 24px;
        }

        .top {
            margin-bottom: 28px;
        }

        .back {
            color: #667085;
            text-decoration: none;
        }

        h1 {
            margin: 12px 0 0;
        }

        form {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 30px;
        }

        form p {
            margin: 0 0 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
        }

        input[type="checkbox"] {
            width: auto;
        }

        #id_auditors {
            padding: 10px 0;
        }

        #id_auditors label {
            font-weight: 400;
        }

        button {
            border: 0;
            padding: 13px 22px;
            border-radius: 9px;
            background: #1f2937;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .errorlist {
            color: #b42318;
        }
    </style>
</head>

<body>

<main>

    <div class="top">

        <a class="back" href="/visits/">
            ← К посещениям
        </a>

        <h1>Новое посещение</h1>

    </div>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Запланировать посещение
        </button>

    </form>

</main>

</body>
</html>
